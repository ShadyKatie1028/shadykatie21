<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shady's Blog - Private Admin Panel</title>
    <style>
        body { background-color: #f7f5f0; font-family: Georgia, serif; padding: 40px 20px; }
        .admin-box { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; border: 1px solid #e0dbd1; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-family: sans-serif; font-size: 0.85rem; text-transform: uppercase; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #333; color: white; border: none; padding: 12px 20px; width: 100%; font-weight: bold; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="admin-box">
        <h2 style="margin-top: 0; text-align: center;">Publish a New Blog Post</h2>
        
        <form id="blogForm" action="https://hook.us2.make.com/adeqwj6dlg40uknbij22col6pkwohhxn" method="POST" target="hidden_iframe">
            
            <label for="title">Post Title</label>
            <input type="text" id="title" name="post_title" required placeholder="e.g., Title">

            <label for="content">Post Content (Paragraph Text)</label>
            <textarea id="content" name="post_content" rows="8" required placeholder="Type your inside thoughts here..."></textarea>

            <button type="button" id="submitBtn">Publish to Website & Blast Email</button>
        </form>
    </div>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

    <script>
        document.getElementById('submitBtn').addEventListener('click', function(e) {
            e.preventDefault();
            
            const form = document.getElementById('blogForm');
            if (form.checkValidity()) {
                form.submit();
                alert('Published successfully!');
                form.reset();
            } else {
                form.reportValidity();
            }
        });
    </script>

</body>
</html>
