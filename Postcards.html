<!DOCTYPE html>
<html lang="en">
   <head>
        <meta charset="UTF-8">

    <title>Postcards - Shady's Blog</title>
    </head>

    <style>
        body {
            margin: 0;
            background-color: #ffffff;
            font-family: serif;
            color: aliceblue;
        }

        .hero-header {
            position: absolute;
            top: 0;
            left: 0%;
            z-index: 1000;
        }

       .hero-background {
            position: relative;
            min-height: 100vh;
            background-image: url('Postcard-Background-Sd.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

        }

        .hero-background2 {
            position: relative;
            min-height: 100vh;
            background-image: url(Postcard-Background-Seattle.jpg);
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

          .hero-background3 {
            position: relative;
            min-height: 100vh;
            background-image: url(Postcard-Background-Boston.jpg);
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
          .hero-background4 {
            position: relative;
            min-height: 100vh;
            background-image: url(Postcard-Background-NY.jpg);
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
          
        .forground-photo {
            position: absolute;
            top: 120px;
            left: 50%;
            
        }
        .positioned-text {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            text-align: center;
            font-family: sans-serif;
        }


        .Planehome {
            position: absolute;
            top: 0;
            left: 25px;
            z-index: 1000;
            width: 25px;
            height: 45px;
            display: block;
             clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
            filter: drop-shadow(1px 2px 3px rgba(0, 0, 0, 0.4));
        }

        .blogs-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .post{
          background-color: rgba(0, 0, 0, 0.35); 
          border-radius: 8px;
          padding: 30px;
          border: 1px solid rgba(0, 0, 0, 0.08); 
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .vintage-postcard { 
            width: 100%;
            max-width: 500px;
            background-color: #faf6ee;
            border: 1px soild #e3dacb;
            border-radius: 2px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            box-sizing: border-box;
            font-family: sans-serif;
        }
    
    .postcard-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 20px;
    } 

    .postcard-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 4px;
        color: #5c554a;
        border-bottom: 2px soild #5c554a;
        padding-bottom: 2px;
    }

    .stamp-box {
        width: 60px;
        height: 75px;
        border: 1px dashed #a89f91;
        display: flex;
        align-items: center;
        justify-self: center;
        font-size: 10px;
        color: #a89f91;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .postcard-body {
        display: flex;
        gap: 20px;
    }


    .postcard-message {
        flex: 1.2;
        border-right: 1px solid #e2dacb;
        padding-right: 15px;
    } 

    .handwritten {
        font-family: 'Courier New', Courier, monospace;
        font-size: 13px;
        line-height: 1.6;
        color: #2b2925;
        margin: 0;
    }

    .postcard-address { 
        flex: 0.8;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 20px;
    }

    .address-line { 
        border-bottom: 1px soild #c9beae;
        width: 100%;
        height: 15px;
    }

    .postcard-location-date {
        font-size: 11px;
        letter-spacing: 1px;
        color: #8a8072;
        text-transform: uppercase;
        margin-bottom: 15px;
    }

    @media (max-width: 600px) {
    .postcard-body { flex-direction: column;}
    .postcard-message {
        border-right: none;
        border-bottom: 1px solid #e2dacb;
        padding-right: 0;
        padding-bottom: 15px;
    }
    }


    .coontainer {
        position: relative; 
    }



        .postcard-photo {
            position: fixed;
            left: 750px;
                        top: 200px;
        }
</style>
</head>

    <div class="hero-background">

             <div class="postcard-photo">

            <p>More Text</p>
            <div class="postcard-location-date"> San Diego June 2026</div>
            <div class="postcard-header"></div>

    </div>



    <div class="hero-background2" loading="lazy">
