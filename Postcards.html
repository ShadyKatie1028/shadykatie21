<!DOCTYPE html>
<html lang="en">
   <head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon_ico/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_ico/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_ico/favicon-16x16.png">
    <link rel="apple-touch-icon" href="favicon_ico/apple-touch-icon.png">
    <link rel="manifest" href="favicon_ico/site.webmanifest">
    <title>Postcards - Shady's Blog</title>
    </head>

    <style>
        html { scroll-behavior: smooth; }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #f4efe8;
            font-family: Georgia, "Times New Roman", serif;
            color: #ffffff;
        }

        .hero-header {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1000;
           
        }

        .hero-header img {
            width: 100px;
            height: auto;
        }

        .hero-background,
        .hero-background2,
        .hero-background3,
        .hero-background4 {
            position: relative;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 110px 24px 60px;
        }

        .hero-background::before,
        .hero-background2::before,
        .hero-background3::before,
        .hero-background4::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(12, 15, 18, 0.26);
        }

        .hero-background {
            background-image: url('Postcard-Background-SD.jpg');
        }

        .hero-background2 {
            background-image: url('Postcard-Background-Seattle.jpg');
        }

        .hero-background3 {
            background-image: url('Postcard-Background-Boston.jpg');
        }

        .hero-background4 {
            background-image: url('Postcard-Background-NY.jpg');
        }

        .positioned-text {
            position: relative;
            z-index: 2;
            width: min(92vw, 980px);
            text-align: center;
            font-family: "Trebuchet MS", Arial, sans-serif;
        }

        .positioned-text h1,
        .positioned-text h2 {
            margin: 0 0 20px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.45);
            font-size: clamp(2rem, 4vw, 4.2rem);
        }

        .positioned-text p {
            margin: 0;
            font-size: clamp(0.8rem, 1.5vw, 1.1rem);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
        }

        .postcard-layout {
            display: grid;
            grid-template-columns: 1.2fr 1.6fr;
            align-items: center;
            gap: 28px;
            margin-top: 28px;
        }

        .postcard-image {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .postcard-image img {
            display: block;
            width: min(100%, 350px);
            height: auto;
            box-shadow: 0 18px 30px rgba(0, 0, 0, 0.24);
            border: 0px solid rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.2);
        }

        .postcard-image.back img {
            width: min(100%, 510px);
            transform: rotate(2.5deg);
        }

        .postcard-image.front img {
            transform: rotate(-4deg) translateY(18px);
        }

        .postcard-caption {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 18px;
            border: 0px solid rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.08);
            letter-spacing: 0.14em;
            font-size: 0.72rem;
            text-transform: uppercase;
            color: #f7f1ea;
        }

        .postcard-location-date {
            margin-top: 19px;
            font-size: 12px;
            letter-spacing: 2px;
            color: #f0e9df;
            text-transform: uppercase;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
        }

        @media (max-width: 760px) {
            .postcard-layout {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .postcard-image.front img,
            .postcard-image.back img {
                transform: none;
                width: min(84vw, 450px);
            }
        }

        @media (max-width: 600px) {
            .hero-header {
                padding: 10px 12px;
            }

            .hero-header img {
                width: 52px;
            }

            .positioned-text h1,
            .positioned-text h2 {
                letter-spacing: 0.1em;
            }
        }
    </style>
</head>

<body>
    <div class="hero-header">
        <a href="index.html" aria-label="Back to home" style="display: inline-flex; align-items: center; text-decoration: none;">
            <img src="Plane-Icon.png" alt="Plane" width="80" height="auto">
        </a>
    </div>

    <section class="hero-background" aria-label="San Diego postcard section">
        <div class="positioned-text">
            <h1>San Diego</h1>
            <div class="postcard-layout">
                <div class="postcard-image front">
                    <img src="BackSDPostcard.png" alt="San Diego postcard front image">
                </div>
                <div class="postcard-image back">
                    <img src="SDPostcard.png" alt="San Diego postcard back image">
                </div>
            </div>
            <div class="postcard-location-date">📍San Diego • June 2026</div>
        </div>
    </section>

    <section class="hero-background2" aria-label="Seattle postcard section" loading="lazy">
        <div class="positioned-text">
            <h2>Seattle</h2>
            <div class="postcard-layout">
            <div class="postcard-image front">
                <img src="SeattleCard.png" alt="Seattle Postcard">
            </div>
            <div class="postcard-image back">
                <img src="SeattleLetter.png" alt="Seattle postcard back">
            </div>
            </div>
            <div class="postcard-location-date">📍Seattle • July 2026</div>
        </div>
    </section>

    <section class="hero-background3" aria-label="Boston postcard section" loading="lazy">
        <div class="positioned-text">
            <h2>Boston</h2>
            <div class="postcard-layout">
                <div class=" postcard-image front">
                                        <img src="BostonPost.png">

                </div>
                <div class="postcard-image back">
                                        <img src="Boston Poscard.png">

                </div>
            </div>
            <div class="postcard-location-date">📍Boston • August 2026 </div>
        </div>
    </section>

    <section class="hero-background4" aria-label="New York postcard section" loading="lazy">
        <div class="positioned-text">
            <h2>New York</h2>
            <div class="postcard-location-date">📍New York • August 2026 </div>
        </div>
    </section>
</body>















</html>
